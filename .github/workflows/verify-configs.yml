name: verify-configs

# Mechanical drift detection for the single-source-of-truth distribution
# config pipeline. See CONTRIBUTING.md for the design.
#
# This workflow MUST pass before any PR can merge into main. It runs the
# generator in --check mode, which:
#   1. Re-emits all 14 generated artifacts from src/configs/source.json
#   2. Re-rewrites the README.md install block from the same source
#   3. Compares each result to what is committed
#   4. Exits 1 if anything differs
#
# If you see this job fail in your PR, run `npm run generate:configs` locally
# and commit the regenerated files. Do NOT bypass — the whole point is that
# bypassing leaves the README/snippets/marketplace listings drifting from
# the actual npm package.

on:
  # NO path filter on pull_request, deliberately. `verify` is a REQUIRED status
  # check on main (branch protection). A required check that is path-filtered
  # never reports on a PR that touches none of those paths, and GitHub treats a
  # missing required check as "not satisfied" rather than "not applicable" — so
  # such a PR is blocked forever, with a green checks list and no way to fix it
  # from the PR itself. That is exactly what happened to #93 (src/errors.ts and
  # tests only): mergeStateStatus BLOCKED, `verify` absent from the rollup.
  # The job is cheap (npm ci + a drift check), so it runs on every PR and the
  # deadlock cannot recur. The push filter below stays: nothing requires it.
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/configs/source.json"
      - "scripts/generate-configs.mjs"
      - "package.json"
      - "README.md"
      - "docs/configs/**"
      - "docs/snippets/**"
      - "server.json"
      - ".github/workflows/verify-configs.yml"

# Least privilege, as in test.yml / release-sync-check.yml: a drift check reads and compares, never writes.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs PR-controlled generator code; it needs no git credentials.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify all 14 distribution artifacts are in sync with source.json
        run: node scripts/generate-configs.mjs --check
