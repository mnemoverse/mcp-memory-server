name: release-sync check

# Issue #31: confirm every first-party public surface (npm, the Official MCP
# Registry, the GitHub release) AND every follow-up surface (the docs site's
# llms-full.txt, the marketing site's server-card.json) is still tracking
# package.json#version — so a half-landed release (e.g. npm published but the
# registry publish failed), or a forgotten bump PR in another repository,
# can't drift silently and make directories, docs readers or visitors read us
# as unmaintained or out of date.
#
# Runs on a schedule (not on every push — a release needs a moment to propagate,
# and we don't want a false red right after tagging) plus manual dispatch.
#
# A red run means one of THREE things, and the log distinguishes them: a
# first-party surface DRIFTED (it answered with the wrong version, so a
# release half-landed: open release.yml and re-run the missing leg), a
# follow-up surface LAGGED (it answered with an older version because a bump
# PR in a different repository (mnemoverse-docs or mnemoverse-marketing)
# hasn't been merged yet; the release pipeline itself is fine), or a surface
# COULD NOT BE CHECKED (it did not answer, so its version is unknown). Only
# the first is drift. The second is a pending merge elsewhere, not a pipeline
# problem. The third is still red, because an unverified surface is not a
# verified one, but it is not grounds to touch the release pipeline either.
#
# Until 2026-09-01 that guidance was the entire alerting story, and it assumed a
# human watching the Actions tab. On 2026-08-31 the v0.10.0 release failed its npm
# publish; this check went red on schedule the next morning and named all three
# drifted surfaces correctly — and it was still unread two days later. The notify
# job at the bottom is the missing half: red now opens an issue.

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: release-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Read-only check — no git ops after checkout, so don't leave the token
          # in .git/config. (SHA-pinning the actions is a repo-wide policy choice;
          # kept at @v4 to match release.yml / verify-configs.yml until that's done.)
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install: the check is pure fetch (Node 18+ global fetch), no deps.
      - name: Check public surfaces track the release
        run: npm run check:release-sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The wave tracker (mnemoverse-agent-pack, protocols/surface-contour.md):
  # release.yml opens a "Wave vX.Y.Z" issue with one line per consumer of the
  # MCP surface; this job probes the consumers itself and re-ticks those
  # lines, closes the wave when every line is green, and labels it stale-wave
  # three days after the release. It runs only the default branch's code and
  # takes nothing from the check job: an artifact from a job that ran a
  # dispatched ref could be forged to tick or close a wave (Copilot on #178),
  # so the probes run here, in the trusted job, and the version comes from
  # the default branch's package.json.
  tick-wave:
    name: Tick the wave tracker
    needs: [check]
    if: always()
    # One tick at a time (a scheduled run and a manual one must not interleave
    # their read-modify-write of the issue body).
    concurrency:
      group: tick-wave
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Only the default branch's code runs with the issues: write token: the
      # tag or dispatch ref could carry any code, main carries only code that
      # passed its required checks (Copilot on #178).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The probes are pure fetch (no dependencies) and read-only; their exit
      # code is the check job's business, this step only wants the result.
      - name: Probe the consumers (trusted code, no write token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SYNC_RESULT: ${{ runner.temp }}/release-sync-result.json
        run: node scripts/check-release-sync.mjs || true
      - name: Tick the open wave issue from the probes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wave-issue.mjs tick --result "${{ runner.temp }}/release-sync-result.json"

  # The check above is correct, and it was correct on the morning it mattered.
  # What was missing is that a scheduled workflow's failure is invisible unless
  # somebody happens to be looking at the Actions tab. This job gives it a
  # destination.
  #
  # Deliberately a separate job: the `issues: write` scope must never sit on the
  # job that executes repository code (`npm run check:release-sync`).
  #
  # Two lifecycle properties are chosen, not overlooked:
  #  * the search is scoped to OPEN issues, so closing the tracker while the
  #    cause is still live does not silence the alarm — the next run files a
  #    fresh one. An alarm you can switch off by closing a tab is not one.
  #  * a persisting drift adds one comment per run and never a second issue.
  #    On this daily cron that is one line a day: a heartbeat, deliberately
  #    not throttled, because "still drifting on day nine" is the signal.
  #
  # Unlike release.yml's twin, this one does NOT fire on cancelled(): a check
  # that was cancelled simply did not run, and tomorrow's cron runs it again.
  # It leaves no half-landed state behind, which is the thing worth announcing.
  #
  # The issue text lives in `env` as a block scalar, not inside the script, so
  # the markdown can carry real backticks with no escaping.
  notify-on-failure:
    name: Drift must reach a human
    needs: [check]
    if: failure()
    runs-on: ubuntu-latest
    # Serialize the alarm. Two failures landing together would both miss the
    # dedupe lookup and both take the create path, the exact duplication the
    # lookup exists to prevent.
    #
    # What `cancel-in-progress: false` actually buys, stated exactly rather than
    # optimistically: Actions holds ONE run per group plus at most ONE waiting
    # behind it. A third arrival does not join a queue, it REPLACES the waiting
    # run, and the replaced run is cancelled. So this is mutual exclusion, not
    # guaranteed delivery, and an earlier version of this comment promised a
    # queue that Actions does not offer.
    #
    # Cheap here: this check runs once a day on a cron, so three runs contending
    # for the group at once takes a manual dispatch storm. And if it happened,
    # the run that holds the group files or adopts the tracker, while a displaced
    # run would only have added a heartbeat comment to an issue that already
    # names the drift.
    concurrency:
      group: release-alarm-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_BODY: |
        `release-sync check` is red. At least one first-party surface (npm, the Official
        MCP Registry, the GitHub release) or follow-up surface (every probed consumer in
        `scripts/consumers.json`: today the docs site's `llms-full.txt`, the marketing
        site's server card and the hosted connector's `/health`) either did **not match**
        `package.json#version`, or could **not be checked at all**. Those are three
        different events and the run log reports them separately, surface by surface.
        [Open the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

        Read the log before acting, because the three outcomes call for different responses:

        * `✗ DRIFT (have vX.Y.Z)` means a **first-party** surface answered, with the wrong
          version. A release half-landed. The publish legs in `release.yml` run npm first,
          then the Official MCP Registry, then the GitHub release, and each is skipped once
          an earlier one fails, so the **first** drifted surface in the list is where to
          look.
        * `✗ FOLLOW-UP LAG (have vX.Y.Z)` means a **follow-up** surface (a consumer from
          `scripts/consumers.json`) answered with an older version. This is **not** drift
          and does **not** mean a release half-landed: the release pipeline already
          succeeded. It means a bump in a *different* repository has not merged or deployed
          yet. The run log prints the fix for each lagging consumer, taken from its
          `fix` in `scripts/consumers.json`, and the open `Wave vX.Y.Z` issue carries the
          same fix on its line. Do not touch `release.yml` for this outcome: it did its job.
        * `? could not be checked` means the surface did not answer at all (a timeout, a
          5xx, a rate limit), or, for a follow-up surface, that its body could not be parsed for
          a version at all. The version it serves is unknown, so this is **not** evidence
          of a failed release or a pending PR, and it is not counted as drift or lag. Re-run
          this check, or let tomorrow's cron settle it, before acting on it.

        **If npm DRIFTED** and the release run shows `npm error code E404` on `PUT` for a
        package that plainly exists, read it as **authorization**, not absence: npm answers
        404 rather than 401 so that it does not disclose whether a private package exists.
        Check `NPM_TOKEN`, cheapest first: does it resolve to anything at all in the job
        (`release.yml` recommends holding it as an **environment** secret on the `release`
        environment, so a renamed environment yields an empty value and this same 404); is
        it unexpired; is it unrevoked; does it grant publish on the `@mnemoverse` scope; is
        the account behind it still in the npm org; and was publish-time 2FA turned on for
        the package. `release.yml` mints this token on npm's **granular access tokens**
        page, and tokens from that page carry an expiry date, so expiry is a live branch
        here rather than one to rank down.

        This issue is updated rather than duplicated while the check stays red, and stops
        being updated once it goes green. It is not closed automatically: it stays open as
        the record until a human closes it, and while it is open the next red run comments
        here instead of opening a second tracker.

        ---
        *Opened automatically by the release-sync check.*
    steps:
      - name: Open or update the drift issue
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = 'Public surfaces are not tracking the released version';
            const runUrl = process.env.RUN_URL;

            // Read the body ONCE, here, outside the try, and let every consumer below
            // use this one string. This body carries no placeholder today, but its twin
            // in release.yml did, and substituting it inline at the create() call left
            // the catch path reporting the RAW template: the last-resort report was the
            // one report that was not valid markdown. Same shape in both files so that
            // stays true of both.
            const body = process.env.ISSUE_BODY || '';

            try {
              // Dedupe on the TITLE, never on labels. A label filter silently matches
              // nothing when the label does not exist in this repo (only `bug` does
              // today), which would make this open a fresh issue on every failure —
              // the same class of quiet malfunction this job exists to end.
              // github.paginate, not a bare listForRepo: the REST endpoint caps a
              // page at 100, so an older tracking issue past that boundary would be
              // missed and this would open a duplicate.
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
                // This repository is PUBLIC with issues enabled, so anyone at all
                // can open an issue whose title contains the marker below. Applying
                // a LABEL, however, needs triage permission, so an outsider's issue
                // can never carry `bug` and never enters this list. It also bounds
                // the pagination that an issue flood could otherwise inflate.
                labels: 'bug',
              });
              // Adopt ONLY an issue this workflow itself opened, and match on a PREFIX
              // rather than a substring.
              //
              // listForRepo returns pull requests too — GitHub models every PR as an
              // issue, and they carry a `pull_request` property. But the sharper
              // problem is not accidental: `includes` over an unfiltered list is a
              // capture primitive. listForRepo returns newest-first and `find` takes
              // the first hit, so an issue planted by any passer-by would absorb the
              // alarm for as long as its author kept re-planting, and the triage body
              // below would never be posted at all. An alarm a stranger can switch
              // off is not an alarm.
              //
              // `github-actions[bot]` is a reserved login that no human account can
              // hold, so authorship is the guard that actually closes this. The label
              // filter above is the cheap first cut, not the guarantee.
              const existing = open.find(
                (i) =>
                  !i.pull_request &&
                  i.user &&
                  i.user.type === 'Bot' &&
                  i.user.login === 'github-actions[bot]' &&
                  i.title.startsWith(MARKER)
              );

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Still drifting as of ' + new Date().toISOString() + ' — [run](' + runUrl + ').',
                });
                core.notice('Updated existing issue #' + existing.number);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: MARKER,
                  body,
                  labels: ['bug'],
                });
                core.notice('Opened issue #' + created.data.number);
              }
            } catch (err) {
              // The one job whose purpose is "do not fail silently" must not fail
              // silently either. If the Issues API rejects this (rate limit, 5xx),
              // the report still has to reach a human, so it goes into the run log
              // and the job summary before this goes red. The workflow has already
              // failed by the time this job runs, so this cannot turn a green run red.
              core.error('Could not file the tracking issue: ' + err.message);
              await core.summary
                .addHeading('Tracking issue could not be filed')
                .addRaw('The GitHub Issues API rejected the write. The report follows so it is not lost.')
                .addSeparator()
                .addRaw(body)
                .write();
              core.setFailed(body);
            }
