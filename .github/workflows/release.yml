name: release

# Automated release pipeline for @mnemoverse/mcp-memory-server.
#
# Trigger: push a semver tag `vX.Y.Z` to main (e.g. `git tag v0.3.2 && git push origin v0.3.2`).
#
# What this workflow does, in order — every gate BEFORE the first irreversible
# step (`npm publish`), ordered so the cheapest checks fail first:
#   1. Checks the tag commit is an ancestor of main (#87) — an unmerged branch's
#      tag must never publish: npm and the MCP Registry are irreversible per version.
#   2. Checks the tag's version matches package.json, package-lock.json and server.json.
#   3. Checks CHANGELOG.md has a dated `## [X.Y.Z] — YYYY-MM-DD` section and
#      extracts it as the release notes (#74).
#   4. Drift check against the COMMITTED tree (#86) — before anything regenerates it.
#   5. npm ci + npm run build (prebuild regenerates every artifact from source.json).
#   6. Validates and packs the .mcpb bundle (#85).
#   7. Smokes the packed npm tarball through its bin entry (#69 follow-up).
#   8. npm publish — repo-scoped automation token from the NPM_TOKEN secret.
#      Skipped when npm already serves the version with the bytes this run
#      packed (a different checksum stops the run), which is what makes a
#      half-landed release resumable. Then waits until npm SERVES the version:
#      npm accepts a publish minutes before it serves it, and the registry in
#      step 9 checks npm at once.
#   9. mcp-publisher login github-oidc + publish — uploads server.json to
#      registry.modelcontextprotocol.io, then verifies the entry propagated.
#      Skipped when the registry already lists the version.
#  10. gh release create — skipped when the release page already carries the
#      .mcpb bundle; otherwise hand-written CHANGELOG section as the body,
#      auto-generated commit list appended, .mcpb bundle attached.
#  11. repository_dispatch to mnemoverse-docs so the docs site learns the new
#      version immediately (#98); its daily cron is the fallback.
#  12. In its own job (notify-consumers), after the release job succeeded: a
#      WORKFLOW dispatch of each consumer's surface-bump contour, on its main,
#      with inputs.version (today mnemoverse/ai-sdk surface-bump.yml). The
#      consumer then checks the tag, the GitHub Release and provenance, bumps,
#      tests and releases; its schedule is the fallback.
#
# Why OIDC instead of a PAT:
# The GitHub OIDC provider issues a short-lived JWT that the MCP Registry trusts on the basis
# of the repo's owner (mnemoverse) and branch/tag claim. No long-lived secret sits in the repo.
# Prereq: `permissions: id-token: write` on the job, and the authenticating user's org
# membership (izgorodin in mnemoverse) must be public — already done.
#
# Prerequisite secrets, added as environment secrets on the `release`
# environment (Settings > Environments > release), where NPM_TOKEN and
# DOCS_DISPATCH_TOKEN both live:
#   - NPM_TOKEN — npm automation token from npmjs.com/settings/{org}/tokens/granular-access-tokens/new
#                 (select "Automation", grant publish access to @mnemoverse/mcp-memory-server).
#   - DOCS_DISPATCH_TOKEN (optional) — fine-grained PAT, mnemoverse-docs only,
#                 contents:write. Missing token degrades to a warning: the docs
#                 site's daily cron catches up within a day.
#
# And on the `consumer-dispatch` environment (no reviewers needed: it can
# only ask consumers to run a workflow they already have):
#   - CONSUMER_DISPATCH_TOKEN (optional) — fine-grained PAT or GitHub App with
#                 "Actions: read and write" on each consumer repository in step
#                 12 (mnemoverse/ai-sdk) and NOTHING else. Never Contents: a
#                 token that can write contents on a consumer can push commits
#                 and release tags there, and a pushed tag publishes that
#                 consumer's package. Not the docs token either. Missing token
#                 degrades to a warning: each consumer's schedule catches up.
#
# To release:
#   1. Bump version in package.json (src/index.ts reads it from there) and run
#      `npm install` so package-lock.json follows.
#   2. `npm run generate:configs` to propagate the new version to server.json.
#   3. Flip CHANGELOG.md's `## [Unreleased]` header to `## [X.Y.Z] — YYYY-MM-DD`
#      (step 3 above fails the release if you forget).
#   4. Commit, push to main (through PR, drift CI passes).
#   5. `git tag v$(node -p "require('./package.json').version")`.
#   6. `git push origin v0.x.y`.
# The workflow does the rest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.2). Must already exist."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    # One run per tag at a time. Two runs for one tag used to be harmless: the
    # second died at `npm publish`. Now that the publish legs skip what exists,
    # both would go on to the registry and the release page together. The
    # second waits instead. This is mutual exclusion, not a queue: Actions
    # holds one run per group plus ONE waiting behind it, so a third dispatch
    # of the same tag replaces the waiting run, which is then cancelled. That
    # costs nothing here, because any run for the tag resumes where the
    # release stands.
    concurrency:
      group: release-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    # Trust boundary (adversarial review F1): every gate below lives in THIS
    # file, and GitHub runs the file at the pushed tag's commit — so the gates
    # stop mistakes, not a write-access actor who tags a branch carrying a
    # gutted copy. The half that closes that hole lives in repo SETTINGS, not
    # here: protect this `release` environment (required reviewers and/or
    # deployment tag rules) and keep NPM_TOKEN as an environment secret; add a
    # ruleset restricting who may create v* tags.
    environment: release
    permissions:
      # contents:write — needed to create the GitHub release.
      # id-token:write — required by `mcp-publisher login github-oidc`.
      contents: write
      id-token: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Both publish targets are irreversible per version, so a tag pushed from
      # an unmerged branch would publish unreviewed code forever (#87). HEAD is
      # the tag's peeled commit after checkout; requiring it to be an ancestor
      # of main means every published tree went through a merged PR.
      - name: Verify the tag commit is on main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD^{commit})" origin/main; then
            echo "::error::tag $TAG is not an ancestor of main — refusing to publish an unreviewed tree"
            exit 1
          fi
          echo "✓ $TAG is on main"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The version lives in THREE places, so the guard checks all three.
      # It used to check package.json alone, and 0.8.2 shipped its PR with the
      # lockfile still reading 0.8.1 — caught in review, not by this step
      # (mcp-memory-server#81). `npm ci` does not compare the lockfile's own
      # `version` field, so a stale one sails through the build and lands in
      # the published tree as a quiet contradiction. server.json is generated
      # from package.json, but it is committed, so a missed
      # `npm run generate:configs` desyncs the registry manifest the same way.
      - name: Verify tag matches package.json, package-lock.json and server.json
        # TAG arrives through env, never through `${{ }}` inside `run:`.
        # `workflow_dispatch.inputs.tag` is human-supplied, so interpolating it
        # into shell SOURCE lets a dispatcher inject commands; via env it is
        # only ever data. (CodeRabbit, #81.)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          echo "tag:             $TAG"
          echo "tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          echo "lock .version:   $LOCK_VERSION"
          echo "lock packages[]: $LOCK_ROOT_VERSION"
          echo "server.json:     $SERVER_VERSION"
          FAIL=0
          for pair in "package.json:$PKG_VERSION" "package-lock.json:$LOCK_VERSION" \
                      "package-lock.json packages[\"\"]:$LOCK_ROOT_VERSION" "server.json:$SERVER_VERSION"; do
            WHERE="${pair%:*}"; GOT="${pair##*:}"
            if [ "$TAG_VERSION" != "$GOT" ]; then
              echo "::error::$WHERE reads $GOT, tag $TAG expects $TAG_VERSION"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      # The hand-written CHANGELOG entry is the half of the release notes a
      # commit list cannot replace, and until now the workflow never read the
      # file at all (#74): the header stayed [Unreleased] forever and the
      # release page showed only auto-generated notes. Fail early if the header
      # was never flipped; extract the section for the release body.
      - name: CHANGELOG has a dated section for this version — extract it
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Anchored full-date regex, not a fixed-string prefix: '— 20' alone
          # would accept '## [X.Y.Z] — 20unreleased' (Copilot, #100). The dots
          # in the version are escaped so 0.9.0 cannot match 0x9x0.
          VER_RE="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
          if ! grep -qE "^## \[$VER_RE\] — 20[0-9]{2}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] — YYYY-MM-DD' section — flip [Unreleased] before tagging"
            exit 1
          fi
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/   { exit }
            found               { print }
          ' CHANGELOG.md > "$NOTES"
          # A flipped header with no body (or a header-like string in prose)
          # would produce an empty section and defeat the gate vacuously.
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::the CHANGELOG section for $VERSION is empty — write the entry before tagging"
            exit 1
          fi
          {
            echo ""
            echo "- npm: https://www.npmjs.com/package/@mnemoverse/mcp-memory-server"
            echo "- MCP Registry: https://registry.modelcontextprotocol.io/v0.1/servers?search=mnemoverse"
          } >> "$NOTES"
          echo "--- release notes ---"
          cat "$NOTES"

      # Drift gate that can actually fail (#86). `npm run build` regenerates
      # every artifact via prebuild, so a check AFTER the build compares the
      # generator's output with itself and passes by construction. This one
      # runs against the COMMITTED tree, before anything rewrites it —
      # generate-configs.mjs is dependency-free, so it needs no npm ci.
      - name: Verify committed artifacts match source.json (pre-build)
        run: node scripts/generate-configs.mjs --check

      - name: Install dependencies
        run: npm ci

      # postbuild regenerates tools.json from the build, so keep the COMMITTED
      # copy first: the gate below compares the two, and a check after the
      # build alone would compare the generator with itself (Copilot on #179).
      - name: Keep the committed tools.json
        run: cp tools.json "$RUNNER_TEMP/tools.committed.json"

      - name: Build (runs generate:configs via prebuild)
        run: npm run build

      - name: The committed tools.json equals what the built server registers
        run: |
          if ! diff -u "$RUNNER_TEMP/tools.committed.json" tools.json; then
            echo "::error::tools.json on the tag is stale: it does not list what the built server registers. Run npm run build and commit tools.json."
            exit 1
          fi

      # Belt to the pre-build gate above: catches a generator that is itself
      # non-deterministic between two runs in the same job.
      - name: Verify no drift between source.json and generated artifacts
        run: npm run verify:configs

      # The manifest.json fixes shipped in 0.8.x reached nobody: no workflow
      # ever packed the .mcpb bundle (#85). Pack BEFORE npm publish so a broken
      # bundle blocks the release while everything is still reversible.
      - name: Validate and pack the .mcpb bundle
        run: |
          set -euo pipefail
          npm run mcpb:validate
          npm run mcpb:pack
          ls -l dist-mcpb/mnemoverse-memory.mcpb

      # The PR-time smoke (test.yml smoke-node18) drives dist/index.js in the
      # working tree. This drives the PACKED tarball through its bin entry —
      # the two slivers the PR smoke cannot see: the `files` list actually
      # shipping dist/, and the bin path resolving after install (#69).
      - name: Smoke the packed tarball through its bin entry
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          SMOKE="$RUNNER_TEMP/pack-smoke"
          mkdir -p "$SMOKE"
          ( cd "$SMOKE" && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL" >/dev/null )
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-06-18","capabilities":{},"clientInfo":{"name":"pack-smoke","version":"0"}}}'
          OUT="$(echo "$REQ" | timeout 30 "$SMOKE/node_modules/.bin/mcp-memory-server" 2>/dev/null | head -c 400 || true)"
          echo "$OUT"
          case "$OUT" in
            *'"serverInfo"'*'"name":"mnemoverse-memory"'*) echo "packed bin: handshake ok" ;;
            *) echo "::error::the packed tarball's bin entry did not complete an MCP initialize"; exit 1 ;;
          esac
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # Publishing the TARBALL (not the directory) ships byte-for-byte what the
      # smoke just verified; a directory publish would re-pack and re-run
      # lifecycle scripts, reopening a gap between tested and shipped.
      #
      # RESUMABLE. An npm version is immutable, so a release that failed AFTER
      # this step could not be run again: the second `npm publish` died on
      # "version exists", and the registry entry, the release page and the docs
      # ping had to be finished by hand. v0.10.2 (2026-09-20) landed exactly
      # there. If npm already serves this version AND serves the bytes this run
      # packed, the step says so and moves on, and a workflow_dispatch of this
      # workflow with the tag runs the legs that never ran.
      #
      # The checksum IS a gate. The build is reproducible (the 0.10.2 tarball
      # was rebuilt byte for byte on another OS and another Node major), so a
      # mismatch is not rebuild noise: this checkout is not what npm shipped,
      # for example because the tag was moved. Finishing the registry entry and
      # the release page from that tree would describe a package npm does not
      # serve.
      #
      # An answer that is neither 200 nor 404 means "could not tell", and the
      # step stops instead of guessing: guessing "absent" would run
      # `npm publish` into a version that exists.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').name")"
          # The request the MCP Registry's own validator makes: the scoped name
          # as ONE escaped path segment.
          URL="https://registry.npmjs.org/${PKG//\//%2F}/$VERSION"
          BODY="${RUNNER_TEMP:-/tmp}/npm-version.json"
          CODE=000
          for i in 1 2 3; do
            CODE="$(curl -sS --max-time 20 -o "$BODY" -w '%{http_code}' "$URL" || true)"
            case "$CODE" in 200|404) break ;; esac
            echo "attempt $i/3: npm answered $CODE"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          case "$CODE" in
            404)
              npm publish "$TARBALL" --access public
              ;;
            200)
              PUBLISHED="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).dist.shasum" "$BODY")"
              LOCAL="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
              if [ "$PUBLISHED" != "$LOCAL" ]; then
                echo "::error::npm serves $PKG@$VERSION with shasum $PUBLISHED, and this run packed $LOCAL. The build is reproducible, so this checkout is not what npm shipped (a moved tag?). Not finishing the release from it: compare the two tarballs first."
                exit 1
              fi
              echo "::notice::$PKG@$VERSION is already on npm with the bytes this run packed, so this run resumes with the legs after it"
              ;;
            *)
              echo "::error::could not tell whether npm already has $PKG@$VERSION (last answer: $CODE). Not guessing: run this workflow again by hand (workflow_dispatch) with tag $TAG."
              exit 1
              ;;
          esac

      # npm answers a publish BEFORE it serves the version ("Your package is
      # being processed and may take a few minutes to become available"), and the
      # MCP Registry validates the npm package the moment it receives
      # server.json, with the very request this step polls. Going there straight
      # away is a race. 0.10.0 and 0.10.1 won it only because npm then
      # registered a version before it answered; v0.10.2 lost it: the registry
      # asked npm two seconds after the publish returned, got a 404 and refused
      # the entry, and npm began serving the version 2 min 36 s later. Wait
      # until npm serves it before telling anyone else it exists.
      - name: Wait until npm serves the new version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').name")"
          URL="https://registry.npmjs.org/${PKG//\//%2F}/$VERSION"
          # Bounded by the clock, not by an attempt count: with a request that can
          # take 20 s, ninety attempts would be 45 minutes, not 15.
          DEADLINE=$((SECONDS + 900))
          i=0
          while :; do
            i=$((i + 1))
            CODE="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "200" ]; then
              echo "npm serves $PKG@$VERSION (attempt $i, ${SECONDS}s into this step)"
              exit 0
            fi
            echo "attempt $i: npm answered $CODE"
            if [ "$SECONDS" -ge "$DEADLINE" ]; then break; fi
            sleep 10
          done
          echo "::error::npm did not serve $PKG@$VERSION within 15 minutes of accepting it. Nothing is lost: once it does, run this workflow by hand (workflow_dispatch) with tag $TAG. The npm step sees the version and skips, and the remaining legs run."
          exit 1

      - name: Install mcp-publisher CLI
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate with MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # Resumable like the npm step: a version the registry already lists is
      # skipped, so a re-run after a LATER leg failed does not die here either
      # (the registry refuses a duplicate version). As above, an answer that is
      # neither 200 nor 404 stops the step instead of being read as "absent".
      # The retries cover the registry reading npm through a cache that still
      # holds the 404 this job stopped seeing a moment ago; after each refusal
      # the step looks again, because a refused attempt whose answer was lost
      # may have landed.
      - name: Publish to Official MCP Registry
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.mnemoverse%2Fmcp-memory-server/versions/$VERSION"
          listed() { curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$URL" || true; }
          CODE=000
          for i in 1 2 3; do
            CODE="$(listed)"
            case "$CODE" in 200|404) break ;; esac
            echo "attempt $i/3: the registry answered $CODE"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          if [ "$CODE" = "200" ]; then
            echo "::notice::the MCP Registry already lists $VERSION, skipping"
            exit 0
          fi
          if [ "$CODE" != "404" ]; then
            echo "::error::could not tell whether the MCP Registry already lists $VERSION (last answer: $CODE). Not guessing: run this workflow again by hand (workflow_dispatch) with tag $TAG."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$(listed)" = "200" ]; then
              echo "::notice::the publisher reported a failure, but the MCP Registry lists $VERSION"
              exit 0
            fi
            echo "attempt $i/5 was refused"
            if [ "$i" -lt 5 ]; then sleep 30; fi
          done
          echo "::error::the MCP Registry refused the entry five times. npm already carries $VERSION, so fix the cause and run this workflow by hand (workflow_dispatch) with tag $TAG: the npm step skips and this leg runs again."
          exit 1

      # Post-publish OBSERVATION, not a gate: `mcp-publisher publish` above has
      # already failed hard if the upload failed. This step only confirms
      # propagation — and it must not strand the release: it used to sit as a
      # hard failure between npm publish and the GitHub release, so one slow
      # propagation left no release page and no .mcpb asset, and a re-run died
      # at npm publish (version exists, 403). Poll, then degrade to a warning.
      - name: Verify the registry entry shows the new version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.mnemoverse%2Fmcp-memory-server/versions/$VERSION"
          for i in $(seq 1 10); do
            RESULT="$(curl -sS "$URL" || true)"
            if echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          srv = d['server']
          assert srv['version'] == '$VERSION'
          print(f'✓ Registry shows {srv[\"name\"]}@{srv[\"version\"]}')
          " 2>/dev/null; then
              exit 0
            fi
            echo "attempt $i/10: not visible yet, waiting 6s..."
            sleep 6
          done
          echo "::warning::registry entry for $VERSION not visible after 60s — check https://registry.modelcontextprotocol.io manually; NOT failing the release"

      # Until 2026-09-20 dispatching a tag that had already been released died at
      # `npm publish`. Now that the publish legs skip what exists, the same
      # dispatch reaches this point, and action-gh-release UPDATES an existing
      # release in place: body rewritten, asset uploaded again. A release page
      # that already carries the bundle is complete, so it is left alone. A
      # page without the bundle (the upload failed) is not, and gets finished.
      - name: Is the release page already complete?
        id: release_page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Only an explicit "release not found" means there is no page. Any other
          # failure (403, rate limit, 5xx) is "could not tell", and the step stops:
          # reading it as "no page" would hand a complete release to the action
          # below, which deletes a same-named asset before uploading it again.
          if OUT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1)"; then
            ASSETS="$OUT"
          elif [[ "$OUT" == *"release not found"* ]]; then
            ASSETS=""
          else
            echo "::error::could not tell whether release $TAG exists: $OUT. Not guessing: run this workflow again by hand (workflow_dispatch) with tag $TAG."
            exit 1
          fi
          if grep -qxF 'mnemoverse-memory.mcpb' <<<"$ASSETS"; then
            echo "::notice::release $TAG already exists with its .mcpb bundle, leaving it untouched"
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release_page.outputs.complete != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          # The hand-written CHANGELOG section is the body; the auto-generated
          # commit list is appended after it (#74).
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: dist-mcpb/mnemoverse-memory.mcpb

      # Tell the docs site a release happened (#98). The receiver
      # (mnemoverse-docs .github/workflows/mcp-version-watch.yml, event type
      # mcp-release) also polls npm daily, so a missing token means at most one
      # day of staleness — a warning here, never a failed release.
      - name: Notify mnemoverse-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN not set — the docs site will catch up via its daily cron"
            exit 0
          fi
          if gh api repos/mnemoverse/mnemoverse-docs/dispatches -f event_type=mcp-release; then
            echo "✓ dispatched mcp-release to mnemoverse-docs"
          else
            echo "::warning::dispatch failed (expired/revoked DOCS_DISPATCH_TOKEN?) — the docs cron will catch up within a day"
          fi

  # ---------------------------------------------------------------------------
  # Step 12: start each consumer's surface-bump contour (mnemoverse/ai-sdk
  # docs/AUTO-UPDATE-CONTOUR.md). Only after the release job succeeded, so npm
  # serves the version and its GitHub Release exists: the consumer checks both
  # (tag on main, Release) before it bumps, since an npm token alone can make
  # neither.
  #
  # A WORKFLOW dispatch, not a repository_dispatch. The repository dispatch
  # endpoint needs Contents: write on the consumer, which also pushes commits
  # and v* tags there, and a tag pushed with a personal token starts the
  # consumer's release workflow: the token would be a publish credential for
  # every consumer. A workflow dispatch needs Actions: write only.
  #
  # Its own job and its own environment, so the token never shares a runner
  # with npm ci, the build or a third-party action: this job checks out
  # nothing and runs one gh call per consumer.
  #
  # Every consumer also polls npm on a schedule, so a missing token or a
  # failed dispatch costs hours of lag, never a failed release: a warning.
  # The version is a hint: each consumer reads npm's latest itself.
  # ---------------------------------------------------------------------------
  notify-consumers:
    name: Start the surface-bump contour of each consumer of the MCP surface
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: consumer-dispatch
    permissions: {}
    steps:
      - name: Dispatch each consumer's contour workflow on its main
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CONSUMER_DISPATCH_TOKEN not set — consumers of the MCP surface will catch up via their scheduled runs"
            exit 0
          fi
          VERSION="${TAG#v}"
          # One "owner/repo:contour-workflow-file" per consumer.
          for CONSUMER in mnemoverse/ai-sdk:surface-bump.yml; do
            REPO="${CONSUMER%%:*}"
            WORKFLOW="${CONSUMER#*:}"
            if gh api -X POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" \
                -f ref=main -f "inputs[version]=$VERSION" >/dev/null; then
              echo "✓ started $REPO $WORKFLOW for $VERSION"
            else
              echo "::warning::could not start $REPO $WORKFLOW (CONSUMER_DISPATCH_TOKEN without Actions: write on it, expired or revoked?) — its scheduled run will catch up"
            fi
          done

  # ---------------------------------------------------------------------------
  # A failed release used to reach nobody.
  #
  # 2026-08-31 21:27Z: v0.10.0 was tagged and merged. Every gate above the npm
  # publish passed; "Publish to npm" then failed with `npm error code E404` on
  # `PUT .../@mnemoverse%2fmcp-memory-server`, and the SIX steps after it — the
  # registry publish, the GitHub release, the docs dispatch — never ran at all.
  # Say it that way round: "twelve of thirteen passed" reads as "only the last
  # one failed", and an on-call engineer would conclude the release page and the
  # docs notification had happened. They had not. The tag then sat unpublished
  # while npm kept serving 0.9.1. The release-sync check caught the drift the
  # next morning at 07:07Z and went red — into the same empty room, because a
  # scheduled workflow's red X is only visible to someone already looking at
  # the Actions tab.
  #
  # This job is the missing half. It gates nothing and cannot fail the release
  # (that already failed); it only gives the failure a destination. Deduped the
  # way the docs repo's link-checker does it: comment on the open issue rather
  # than opening a second one.
  #
  # Two lifecycle properties are chosen, not overlooked:
  #  * the search is scoped to OPEN issues, so closing the tracker while the
  #    cause is still live does not silence the alarm — the next failure files
  #    a fresh one. An alarm you can switch off by closing a tab is not one.
  #  * a persisting failure adds one comment per run and never a second issue.
  #    On the daily cron that is one line a day: a heartbeat, deliberately not
  #    throttled, because "still broken on day nine" is the signal.
  #
  # The issue text lives in `env` as a block scalar, not inside the script, so
  # the markdown can carry real backticks with no escaping.
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: A failed release must reach a human
    needs: [release]
    # failure() and cancelled() are DIFFERENT status functions, and an explicit
    # `if:` replaces the implicit success(). failure() alone stays false when the
    # release job is cancelled — including a rejected or abandoned approval on the
    # `release` environment above, which this file itself recommends protecting
    # with required reviewers. A cancelled release leaves exactly the state this
    # job exists to announce: a tag that nothing published. So both count.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    # Serialize the alarm. Two failures landing together would both miss the
    # dedupe lookup and both take the create path, the exact duplication the
    # lookup exists to prevent.
    #
    # What `cancel-in-progress: false` actually buys, stated exactly rather than
    # optimistically: Actions holds ONE run per group plus at most ONE waiting
    # behind it. A third arrival does not join a queue, it REPLACES the waiting
    # run, and the replaced run is cancelled. So this is mutual exclusion, not
    # guaranteed delivery, and an earlier version of this comment promised a
    # queue that Actions does not offer.
    #
    # Accepted, because of what a displaced run would have carried. The run that
    # holds the group opens or adopts the tracking issue; every run after it only
    # adds a heartbeat comment naming a failure that issue already reports. A
    # displaced run also still leaves its own red run in the Actions tab. Losing
    # a duplicate heartbeat is the cheaper side of this trade than racing two
    # creates and splitting the alarm across two issues.
    concurrency:
      group: release-alarm-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      # Same resolution the seven gates above use. On a workflow_dispatch
      # re-run — which is exactly the recovery path this job exists to serve —
      # github.ref_name is the BRANCH, so a bare ref_name would title the issue
      # after 'main' instead of the tag that failed.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # __HEADING__ is substituted by the script with a heading built from a
      # VALIDATED tag. The raw tag is deliberately not interpolated here: this
      # block is rendered markdown, and `workflow_dispatch.inputs.tag` is an
      # unvalidated free-form string.
      ISSUE_BODY: |
        __HEADING__

        The release workflow did not complete — it failed or was cancelled — so at
        least one public surface is not serving this version.
        [Open the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

        **Read the failing step before assuming.** The one that has bitten us:

        > `npm error code E404` — `PUT https://registry.npmjs.org/@mnemoverse%2fmcp-memory-server`

        A 404 on `PUT` for a package that plainly exists is **not** "package not found".
        npm answers 404 rather than 401 so that it does not disclose whether a private
        package exists. So read it as an **authorization** problem and check, cheapest
        first: does `NPM_TOKEN` resolve to anything at all in this job; is it unexpired;
        is it unrevoked; does it grant publish on the `@mnemoverse` scope; is the account
        behind it still in the npm org; and was publish-time 2FA turned on for the package.

        Two notes on the first two of those, because both have a repo-specific answer.
        The secret is recommended in this file as an **environment** secret on the
        `release` environment rather than a repository secret, so a renamed or deleted
        environment leaves `secrets.NPM_TOKEN` empty and produces this same 404 with
        nothing actually revoked. And the setup section at the top of this file mints the
        token on npm's **granular access tokens** page; tokens from that page carry an
        expiry date, so expiry is a live branch here. An earlier draft of this text ranked
        expiry down, on the grounds that the setup section called for a non-expiring
        classic token. It does not: the URL it gives is the granular-access-tokens page,
        and "Automation" there is a token *type* on that page, not the classic token.

        **After fixing the cause**, look at which step failed before touching anything.
        The publish legs run in the order npm → Official MCP Registry → GitHub release,
        and each is skipped once an earlier one fails, so a partial release means the
        later surfaces were never attempted at all. If `Publish to npm` never succeeded,
        re-run this workflow from the tag. If npm already carries this version (a later
        leg failed), run this workflow by hand (Actions, release, Run workflow) with the
        tag: the npm step sees the published version and skips, a registry entry that
        already exists is skipped too, and the legs that never ran run. CONTRIBUTING.md
        describes it under "Automated release pipeline" (the half-landed release note).
        Nothing closes this issue for you: close it by hand once that run is green.

        `release-sync check` (daily, 07:00 UTC) is what verifies the recovery: it compares
        every first-party surface against `package.json#version` and stays red until they
        agree.

        ---
        *Opened automatically by the release workflow.*
    steps:
      - name: Open or update the release-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = 'Release did not complete';

            // `workflow_dispatch.inputs.tag` is `type: string`, which GitHub does not
            // validate at all, and the REST API will accept a multi-line value. It
            // reaches two rendered sinks — the issue title and the body heading — so
            // an unchecked value could forge markdown under this bot's name, hide the
            // real advisory inside an unclosed HTML comment, or fire an @org/team
            // mention. That needs write access, so it buys attribution rather than
            // privilege; it is still not this job's to hand out.
            //
            // Refuse anything that is not a plausible tag rather than trying to escape
            // it. A rejected value still produces a usable alarm — the run link and the
            // triage body do not depend on it.
            const rawTag = process.env.TAG || '';
            const tag = /^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$/.test(rawTag)
              ? rawTag
              : '(tag name refused as unsafe)';
            const heading = 'Release did not complete for **' + tag + '**.';
            const runUrl = process.env.RUN_URL;

            // Render the body ONCE, here, outside the try. Every consumer below uses
            // this string and only this string. Substituting __HEADING__ inline at the
            // create() call meant the catch path fell back to the RAW template, so the
            // last-resort report — the one that runs precisely when the Issues API is
            // unavailable and the job summary is the only surface left — was the single
            // report that printed a literal `__HEADING__` and was not valid markdown.
            // These three lines cannot throw (a regex test and two string ops), so
            // hoisting them out of the try does not widen what goes unhandled.
            const body = (process.env.ISSUE_BODY || '').replace('__HEADING__', heading);

            try {
              // Dedupe on the TITLE, never on labels. A label filter silently matches
              // nothing when the label does not exist in this repo (only `bug` does
              // today), which would make this open a fresh issue on every failure —
              // the same class of quiet malfunction this job exists to end.
              // github.paginate, not a bare listForRepo: the REST endpoint caps a
              // page at 100, so an older tracking issue past that boundary would be
              // missed and this would open a duplicate.
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
                // This repository is PUBLIC with issues enabled, so anyone at all
                // can open an issue whose title contains the marker below. Applying
                // a LABEL, however, needs triage permission, so an outsider's issue
                // can never carry `bug` and never enters this list. It also bounds
                // the pagination that an issue flood could otherwise inflate.
                labels: 'bug',
              });
              // Adopt ONLY an issue this workflow itself opened, and match on a PREFIX
              // rather than a substring.
              //
              // listForRepo returns pull requests too — GitHub models every PR as an
              // issue, and they carry a `pull_request` property. But the sharper
              // problem is not accidental: `includes` over an unfiltered list is a
              // capture primitive. listForRepo returns newest-first and `find` takes
              // the first hit, so an issue planted by any passer-by would absorb the
              // alarm for as long as its author kept re-planting, and the triage body
              // below would never be posted at all. An alarm a stranger can switch
              // off is not an alarm.
              //
              // `github-actions[bot]` is a reserved login that no human account can
              // hold, so authorship is the guard that actually closes this. The label
              // filter above is the cheap first cut, not the guarantee.
              const existing = open.find(
                (i) =>
                  !i.pull_request &&
                  i.user &&
                  i.user.type === 'Bot' &&
                  i.user.login === 'github-actions[bot]' &&
                  i.title.startsWith(MARKER)
              );

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Failed again for **' + tag + '** at ' + new Date().toISOString() + ' — [run](' + runUrl + ').',
                });
                core.notice('Updated existing issue #' + existing.number);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: MARKER + ': ' + tag,
                  body,
                  labels: ['bug'],
                });
                core.notice('Opened issue #' + created.data.number);
              }
            } catch (err) {
              // The one job whose purpose is "do not fail silently" must not fail
              // silently either. If the Issues API rejects this (rate limit, 5xx),
              // the report still has to reach a human, so it goes into the run log
              // and the job summary before this goes red. The workflow has already
              // failed by the time this job runs, so this cannot turn a green run red.
              core.error('Could not file the tracking issue: ' + err.message);
              await core.summary
                .addHeading('Tracking issue could not be filed')
                .addRaw('The GitHub Issues API rejected the write. The report follows so it is not lost.')
                .addSeparator()
                .addRaw(body)
                .write();
              core.setFailed(body);
            }
